<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Barkat Wears</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#0f0f0f;
    color:white;
    font-family:sans-serif;
}

.glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.08);
}

.sidebar{
    transform:translateX(-100%);
    transition:.3s;
}

.sidebar.active{
    transform:translateX(0);
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#111;
    border:1px solid #d4af37;
    padding:14px 20px;
    border-radius:12px;
    z-index:9999;
}

.spinner{
    border:4px solid rgba(255,255,255,0.1);
    border-top:4px solid #d4af37;
    border-radius:50%;
    width:45px;
    height:45px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.product-card:hover{
    transform:translateY(-5px);
}

</style>
</head>

<body>

<!-- AUTH SCREEN -->
<div id="authScreen"
class="min-h-screen flex items-center justify-center p-5">

    <div class="glass w-full max-w-md rounded-3xl p-8">

        <h1 class="text-4xl font-bold text-center text-yellow-500 mb-2">
            Barkat Wears
        </h1>

        <p class="text-center text-gray-400 mb-8">
            Premium Fashion Store
        </p>

        <input
            id="email"
            type="email"
            placeholder="Email"
            class="w-full bg-black/40 p-4 rounded-2xl outline-none mb-4"
        />

        <input
            id="password"
            type="password"
            placeholder="Password"
            class="w-full bg-black/40 p-4 rounded-2xl outline-none mb-6"
        />

        <button
            id="loginBtn"
            class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-bold mb-4">
            Login
        </button>

        <button
            id="signupBtn"
            class="w-full glass py-4 rounded-2xl font-bold">
            Sign Up
        </button>

    </div>

</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

<!-- NAVBAR -->
<nav class="glass sticky top-0 z-50 px-5 py-4 flex items-center justify-between">

    <div class="flex items-center gap-4">

        <button id="menuBtn" class="text-3xl">
            ☰
        </button>

        <h1 class="text-2xl font-bold text-yellow-500">
            Barkat Wears
        </h1>

    </div>

    <div class="flex items-center gap-4">

        <input
            id="searchInput"
            type="text"
            placeholder="Search..."
            class="hidden md:block bg-black/40 px-4 py-2 rounded-xl outline-none"
        />

        <button id="logoutBtn"
            class="bg-red-500 px-4 py-2 rounded-xl">
            Logout
        </button>

    </div>

</nav>

<!-- SIDEBAR -->
<div id="sidebar"
class="sidebar fixed top-0 left-0 w-72 h-full bg-black z-50 p-6">

    <div class="flex justify-between items-center mb-8">

        <h2 class="text-2xl font-bold text-yellow-500">
            Categories
        </h2>

        <button id="closeSidebar" class="text-3xl">
            ×
        </button>

    </div>

    <div class="space-y-3">

        <button class="categoryBtn w-full glass p-4 rounded-xl"
            data-category="All">
            All Categories
        </button>

        <button class="categoryBtn w-full glass p-4 rounded-xl"
            data-category="Clothes">
            Clothes
        </button>

        <button class="categoryBtn w-full glass p-4 rounded-xl"
            data-category="Caps">
            Caps
        </button>

        <button class="categoryBtn w-full glass p-4 rounded-xl"
            data-category="Trousers">
            Trousers
        </button>

        <button class="categoryBtn w-full glass p-4 rounded-xl"
            data-category="Jackets">
            Jackets
        </button>

        <button class="categoryBtn w-full glass p-4 rounded-xl"
            data-category="Shirts">
            Shirts
        </button>

        <button class="categoryBtn w-full glass p-4 rounded-xl"
            data-category="Shoes">
            Shoes
        </button>

    </div>

</div>

<!-- PRODUCTS -->
<section class="p-5">

    <div class="mb-8">

        <h2 class="text-3xl font-bold">
            Trending Products
        </h2>

        <p class="text-gray-400">
            Premium Collection
        </p>

    </div>

    <div id="loader"
        class="flex justify-center py-20">

        <div class="spinner"></div>

    </div>

    <div id="products"
        class="grid grid-cols-2 md:grid-cols-4 gap-5">
    </div>

</section>

<!-- PRODUCT MODAL -->
<div id="productModal"
class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">

    <div class="glass rounded-3xl max-w-5xl w-full overflow-hidden">

        <div class="grid md:grid-cols-2">

            <img id="modalImage"
                class="w-full h-full object-cover"/>

            <div class="p-6">

                <h2 id="modalName"
                    class="text-3xl font-bold mb-4">
                </h2>

                <p id="modalPrice"
                    class="text-yellow-500 text-2xl mb-4">
                </p>

                <p id="modalDesc"
                    class="text-gray-300 mb-5">
                </p>

                <div class="space-y-3">

                    <p>
                        <strong>Sizes:</strong>
                        <span id="modalSizes"></span>
                    </p>

                    <p>
                        <strong>Colors:</strong>
                        <span id="modalColors"></span>
                    </p>

                    <p>
                        <strong>Fabric:</strong>
                        <span id="modalFabric"></span>
                    </p>

                    <p>
                        <strong>Availability:</strong>
                        <span id="modalStock"></span>
                    </p>

                </div>

                <a
                    id="whatsappBtn"
                    target="_blank"
                    class="block mt-8 bg-green-500 text-center py-4 rounded-2xl font-bold">
                    Shop on WhatsApp
                </a>

            </div>

        </div>

    </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDd--zaZOEPE5lJp0XuItBO7x8TIeWFuHw",
  authDomain: "barkat-wears.firebaseapp.com",
  projectId: "barkat-wears",
  storageBucket: "barkat-wears.firebasestorage.app",
  messagingSenderId: "449327583852",
  appId: "1:449327583852:web:e003b8b21c37b75203fe49"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const authScreen = document.getElementById("authScreen");

const appScreen = document.getElementById("app");

function toast(message){

    const div=document.createElement("div");

    div.className="toast";

    div.innerText=message;

    document.body.appendChild(div);

    setTimeout(()=>{
        div.remove();
    },3000);

}

document.getElementById("signupBtn").onclick = async()=>{

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    try{

        await createUserWithEmailAndPassword(auth,email,password);

        toast("Signup Successful");

    }catch(error){

        toast(error.message);

    }

};

document.getElementById("loginBtn").onclick = async()=>{

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    try{

        await signInWithEmailAndPassword(auth,email,password);

        toast("Login Successful");

    }catch(error){

        toast(error.message);

    }

};

document.getElementById("logoutBtn").onclick = async()=>{

    await signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

    if(user){

        authScreen.classList.add("hidden");

        appScreen.classList.remove("hidden");

    }else{

        authScreen.classList.remove("hidden");

        appScreen.classList.add("hidden");

    }

});

let allProducts=[];

let selectedCategory="All";

const productsContainer=document.getElementById("products");

const loader=document.getElementById("loader");

onSnapshot(collection(db,"products"),(snapshot)=>{

    loader.style.display="none";

    allProducts=[];

    snapshot.forEach(doc=>{

        allProducts.push({
            id:doc.id,
            ...doc.data()
        });

    });

    filterProducts();

});

function renderProducts(products){

    productsContainer.innerHTML="";

    products.forEach(product=>{

        productsContainer.innerHTML += `

            <div
                onclick='openModal(${JSON.stringify(product)})'
                class="product-card glass rounded-3xl overflow-hidden transition cursor-pointer">

                <img src="${product.image}"
                    class="w-full h-60 object-cover"/>

                <div class="p-4">

                    <div class="flex justify-between">

                        <h3 class="font-bold">
                            ${product.name}
                        </h3>

                        <span class="text-yellow-500">
                            Rs ${product.price}
                        </span>

                    </div>

                    <p class="text-gray-400 text-sm mt-2">
                        ${product.description}
                    </p>

                    <button
                        class="mt-4 w-full bg-yellow-500 text-black py-3 rounded-xl font-bold">
                        View Product
                    </button>

                </div>

            </div>

        `;
    });

}

function filterProducts(){

    let filtered=allProducts;

    if(selectedCategory!=="All"){

        filtered=filtered.filter(
            p=>p.category===selectedCategory
        );

    }

    const search=document.getElementById("searchInput")
    .value
    .toLowerCase();

    if(search){

        filtered=filtered.filter(
            p=>p.name.toLowerCase().includes(search)
        );

    }

    renderProducts(filtered);

}

document.querySelectorAll(".categoryBtn").forEach(btn=>{

    btn.onclick=()=>{

        selectedCategory=btn.dataset.category;

        document.getElementById("sidebar")
        .classList.remove("active");

        filterProducts();

    };

});

document.getElementById("searchInput")
.addEventListener("input",filterProducts);

document.getElementById("menuBtn").onclick=()=>{

    document.getElementById("sidebar")
    .classList.add("active");

};

document.getElementById("closeSidebar").onclick=()=>{

    document.getElementById("sidebar")
    .classList.remove("active");

};

window.openModal=(product)=>{

    document.getElementById("productModal")
    .classList.remove("hidden");

    document.getElementById("productModal")
    .classList.add("flex");

    document.getElementById("modalImage").src=product.image;

    document.getElementById("modalName").innerText=product.name;

    document.getElementById("modalPrice").innerText=
    `Rs ${product.price}`;

    document.getElementById("modalDesc").innerText=
    product.description;

    document.getElementById("modalSizes").innerText=
    product.sizes;

    document.getElementById("modalColors").innerText=
    product.colors;

    document.getElementById("modalFabric").innerText=
    product.fabric;

    document.getElementById("modalStock").innerText=
    product.stock;

    document.getElementById("whatsappBtn").href =
    `https://wa.me/923286990510?text=${encodeURIComponent(
        "Assalamualaikum, I want to order this product from Barkat Wears."
    )}`;

};

document.getElementById("productModal")
.addEventListener("click",(e)=>{

    if(e.target.id==="productModal"){

        document.getElementById("productModal")
        .classList.add("hidden");

    }

});

</script>

</body>
</html>
