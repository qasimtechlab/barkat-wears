<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Barkat Wears</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#0f0f0f;
    color:white;
    font-family:sans-serif;
}

.glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.08);
}

.sidebar{
    transform:translateX(-100%);
    transition:.3s;
}

.sidebar.active{
    transform:translateX(0);
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#111;
    border:1px solid #d4af37;
    padding:14px 20px;
    border-radius:12px;
    z-index:9999;
}

.product-card{
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-6px);
}

.spinner{
    border:4px solid rgba(255,255,255,0.1);
    border-top:4px solid #d4af37;
    border-radius:50%;
    width:45px;
    height:45px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.hide-scroll::-webkit-scrollbar{
    display:none;
}

</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="authScreen"
class="min-h-screen flex items-center justify-center p-5">

    <div class="glass w-full max-w-md rounded-3xl p-8">

        <h1 class="text-4xl font-bold text-center text-yellow-500 mb-2">
            Barkat Wears
        </h1>

        <p class="text-center text-gray-400 mb-8">
            Premium Fashion Store
        </p>

        <input
            id="email"
            type="email"
            placeholder="Email"
            class="w-full bg-black/40 p-4 rounded-2xl outline-none mb-4"
        />

        <input
            id="password"
            type="password"
            placeholder="Password"
            class="w-full bg-black/40 p-4 rounded-2xl outline-none mb-6"
        />

        <button
            id="loginBtn"
            class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-bold mb-4">
            Login
        </button>

        <button
            id="signupBtn"
            class="w-full glass py-4 rounded-2xl font-bold">
            Sign Up
        </button>

    </div>

</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

<!-- NAVBAR -->
<nav class="glass sticky top-0 z-50 px-5 py-4 flex items-center justify-between">

    <div class="flex items-center gap-4">

        <button id="menuBtn" class="text-3xl">
            ☰
        </button>

        <h1 class="text-2xl font-bold text-yellow-500">
            Barkat Wears
        </h1>

    </div>

    <div class="flex items-center gap-3">

        <input
            id="searchInput"
            type="text"
            placeholder="Search..."
            class="hidden md:block bg-black/40 px-4 py-2 rounded-xl outline-none"
        />

        <button
            id="logoutBtn"
            class="bg-red-500 px-4 py-2 rounded-xl">
            Logout
        </button>

    </div>

</nav>

<!-- SIDEBAR -->
<div id="sidebar"
class="sidebar fixed top-0 left-0 w-72 h-full bg-black z-50 p-6 overflow-y-auto">

    <div class="flex items-center justify-between mb-8">

        <h2 class="text-2xl font-bold text-yellow-500">
            Categories
        </h2>

        <button id="closeSidebar" class="text-3xl">
            ×
        </button>

    </div>

    <div class="space-y-3">

        <button class="categoryBtn glass p-4 rounded-xl w-full"
            data-category="All">
            All Categories
        </button>

        <button class="categoryBtn glass p-4 rounded-xl w-full"
            data-category="Clothes">
            Clothes
        </button>

        <button class="categoryBtn glass p-4 rounded-xl w-full"
            data-category="Caps">
            Caps
        </button>

        <button class="categoryBtn glass p-4 rounded-xl w-full"
            data-category="Trousers">
            Trousers
        </button>

        <button class="categoryBtn glass p-4 rounded-xl w-full"
            data-category="Jackets">
            Jackets
        </button>

        <button class="categoryBtn glass p-4 rounded-xl w-full"
            data-category="Shirts">
            Shirts
        </button>

        <button class="categoryBtn glass p-4 rounded-xl w-full"
            data-category="Shoes">
            Shoes
        </button>

    </div>

</div>

<!-- HOME -->
<section id="homePage" class="p-5">

    <div class="mb-8">

        <h2 class="text-3xl font-bold">
            Trending Products
        </h2>

        <p class="text-gray-400">
            Premium Collection
        </p>

    </div>

    <div id="loader"
    class="flex justify-center py-20">

        <div class="spinner"></div>

    </div>

    <div id="products"
    class="grid grid-cols-2 md:grid-cols-4 gap-5">
    </div>

</section>

<!-- PRODUCT PAGE -->
<section id="productPage"
class="hidden min-h-screen bg-black">

    <div class="sticky top-0 z-40 bg-black p-4 border-b border-white/10 flex items-center gap-4">

        <button id="backBtn"
        class="text-3xl">
            ←
        </button>

        <h2 class="text-xl font-bold">
            Product Details
        </h2>

    </div>

    <!-- IMAGE -->
    <div class="w-full bg-black">

        <img
            id="detailImage"
            class="w-full h-[420px] object-cover"
        />

    </div>

    <!-- DETAILS -->
    <div class="p-5 rounded-t-[35px] bg-[#111] -mt-6 relative z-20">

        <div class="flex items-start justify-between gap-4">

            <div>

                <h2 id="detailName"
                class="text-3xl font-bold mb-2">
                </h2>

                <p id="detailCategory"
                class="text-yellow-500">
                </p>

            </div>

            <h3 id="detailPrice"
            class="text-3xl font-bold text-yellow-500">
            </h3>

        </div>

        <div class="mt-6">

            <h3 class="text-xl font-bold mb-3">
                Description
            </h3>

            <p id="detailDescription"
            class="text-gray-300 leading-7">
            </p>

        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">

            <div class="glass p-4 rounded-2xl">

                <p class="text-gray-400 text-sm">
                    Sizes
                </p>

                <h3 id="detailSizes"
                class="font-bold text-lg mt-2">
                </h3>

            </div>

            <div class="glass p-4 rounded-2xl">

                <p class="text-gray-400 text-sm">
                    Colors
                </p>

                <h3 id="detailColors"
                class="font-bold text-lg mt-2">
                </h3>

            </div>

            <div class="glass p-4 rounded-2xl">

                <p class="text-gray-400 text-sm">
                    Fabric
                </p>

                <h3 id="detailFabric"
                class="font-bold text-lg mt-2">
                </h3>

            </div>

            <div class="glass p-4 rounded-2xl">

                <p class="text-gray-400 text-sm">
                    Availability
                </p>

                <h3 id="detailStock"
                class="font-bold text-lg mt-2 text-green-400">
                </h3>

            </div>

        </div>

        <!-- BUTTONS -->
        <div class="grid gap-4 mt-10 mb-20">

            <button
                class="bg-yellow-500 text-black py-4 rounded-2xl font-bold text-lg">
                Buy Now
            </button>

            <a
                id="whatsappBtn"
                target="_blank"
                class="bg-green-500 text-white text-center py-4 rounded-2xl font-bold text-lg">
                Shop on WhatsApp
            </a>

        </div>

    </div>

</section>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDd--zaZOEPE5lJp0XuItBO7x8TIeWFuHw",
  authDomain: "barkat-wears.firebaseapp.com",
  projectId: "barkat-wears",
  storageBucket: "barkat-wears.firebasestorage.app",
  messagingSenderId: "449327583852",
  appId: "1:449327583852:web:e003b8b21c37b75203fe49"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

function toast(message){

    const div=document.createElement("div");

    div.className="toast";

    div.innerText=message;

    document.body.appendChild(div);

    setTimeout(()=>{
        div.remove();
    },3000);

}

document.getElementById("signupBtn").onclick=async()=>{

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        toast("Signup Successful");

    }catch(error){

        toast(error.message);

    }

};

document.getElementById("loginBtn").onclick=async()=>{

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        toast("Login Successful");

    }catch(error){

        toast(error.message);

    }

};

document.getElementById("logoutBtn").onclick=async()=>{

    await signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

    if(user){

        document.getElementById("authScreen")
        .classList.add("hidden");

        document.getElementById("app")
        .classList.remove("hidden");

    }else{

        document.getElementById("authScreen")
        .classList.remove("hidden");

        document.getElementById("app")
        .classList.add("hidden");

    }

});

let allProducts=[];

let selectedCategory="All";

const productsContainer=document.getElementById("products");

onSnapshot(collection(db,"products"),(snapshot)=>{

    document.getElementById("loader")
    .style.display="none";

    allProducts=[];

    snapshot.forEach(doc=>{

        allProducts.push({
            id:doc.id,
            ...doc.data()
        });

    });

    filterProducts();

});

function renderProducts(products){

    productsContainer.innerHTML="";

    products.forEach(product=>{

        productsContainer.innerHTML += `

            <div
            onclick='openProduct(${JSON.stringify(product)})'
            class="product-card glass rounded-3xl overflow-hidden cursor-pointer">

                <img
                src="${product.image}"
                class="w-full h-56 object-cover"/>

                <div class="p-4">

                    <div class="flex justify-between gap-2">

                        <h3 class="font-bold text-lg">
                            ${product.name}
                        </h3>

                        <span class="text-yellow-500 font-bold">
                            Rs ${product.price}
                        </span>

                    </div>

                    <p class="text-gray-400 text-sm mt-2">
                        ${product.description}
                    </p>

                    <button
                    class="mt-4 bg-yellow-500 text-black w-full py-3 rounded-xl font-bold">
                        View Product
                    </button>

                </div>

            </div>

        `;

    });

}

function filterProducts(){

    let filtered=allProducts;

    if(selectedCategory!=="All"){

        filtered=filtered.filter(
            p=>p.category===selectedCategory
        );

    }

    const search=document.getElementById("searchInput")
    .value
    .toLowerCase();

    if(search){

        filtered=filtered.filter(
            p=>p.name.toLowerCase().includes(search)
        );

    }

    renderProducts(filtered);

}

document.querySelectorAll(".categoryBtn").forEach(btn=>{

    btn.onclick=()=>{

        selectedCategory=btn.dataset.category;

        document.getElementById("sidebar")
        .classList.remove("active");

        filterProducts();

    };

});

document.getElementById("searchInput")
.addEventListener("input",filterProducts);

document.getElementById("menuBtn").onclick=()=>{

    document.getElementById("sidebar")
    .classList.add("active");

};

document.getElementById("closeSidebar").onclick=()=>{

    document.getElementById("sidebar")
    .classList.remove("active");

};

window.openProduct=(product)=>{

    document.getElementById("homePage")
    .classList.add("hidden");

    document.getElementById("productPage")
    .classList.remove("hidden");

    document.getElementById("detailImage")
    .src=product.image;

    document.getElementById("detailName")
    .innerText=product.name;

    document.getElementById("detailCategory")
    .innerText=product.category;

    document.getElementById("detailPrice")
    .innerText=`Rs ${product.price}`;

    document.getElementById("detailDescription")
    .innerText=product.description;

    document.getElementById("detailSizes")
    .innerText=product.sizes;

    document.getElementById("detailColors")
    .innerText=product.colors;

    document.getElementById("detailFabric")
    .innerText=product.fabric;

    document.getElementById("detailStock")
    .innerText=product.stock;

    document.getElementById("whatsappBtn").href =
    `https://wa.me/923286990510?text=${encodeURIComponent(
        "Assalamualaikum, I want to order this product from Barkat Wears."
    )}`;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};

document.getElementById("backBtn").onclick=()=>{

    document.getElementById("productPage")
    .classList.add("hidden");

    document.getElementById("homePage")
    .classList.remove("hidden");

};

</script>

</body>
</html>
